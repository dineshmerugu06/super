<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infinian · Interactive 3D — Merugu Dinesh Kumar</title>
<meta name="description" content="Infinian (Lineage Series) — real-time 3D model viewer. Model by Doctor A., CC Attribution.">
<style>
  :root{ --ink:#dceef6; --dim:#8fd0f0; --accent:#72b2d5; --gold:#e8b558; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#05090b; }
  body{ font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; color:var(--ink); }
  #scene{ position:fixed; inset:0; display:block; cursor:grab; }
  #scene:active{ cursor:grabbing; }
  .vignette{ position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 46%, rgba(3,10,16,.55) 100%); }
  header{ position:fixed; top:26px; left:32px; pointer-events:none; z-index:5; }
  header .kicker{ font-size:11px; letter-spacing:.34em; color:var(--dim); text-transform:uppercase; }
  header h1{ font-size:clamp(34px,6vw,58px); font-weight:800; letter-spacing:.12em; line-height:1.04;
    background:linear-gradient(180deg,#fdf6dd 15%,var(--gold) 55%,#9a6a24 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 14px rgba(232,181,88,.25)); }
  header .sub{ margin-top:6px; font-size:12px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase; }
  #back{ position:fixed; top:30px; right:32px; z-index:6; color:var(--ink); text-decoration:none;
    font-size:12px; letter-spacing:.18em; text-transform:uppercase; padding:10px 18px;
    border:1px solid rgba(143,208,240,.4); border-radius:999px; backdrop-filter:blur(6px);
    background:rgba(13,48,80,.35); transition:.25s; }
  #back:hover{ border-color:var(--gold); color:var(--gold); }
  #actions{ position:fixed; left:50%; bottom:52px; transform:translateX(-50%); z-index:6;
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:min(1060px,94vw); }
  #actions button{ font:inherit; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink); background:rgba(13,48,80,.45); border:1px solid rgba(143,208,240,.35);
    padding:9px 14px; border-radius:999px; cursor:pointer; backdrop-filter:blur(6px); transition:.2s; }
  #actions button:hover{ border-color:var(--accent); color:#fff; }
  #actions button.active{ background:rgba(232,181,88,.16); border-color:var(--gold); color:var(--gold); }
  #hint{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:5;
    font-size:11px; letter-spacing:.2em; color:rgba(220,238,246,.5); text-transform:uppercase; pointer-events:none; }
  footer{ position:fixed; left:32px; bottom:20px; z-index:5; font-size:11px; letter-spacing:.06em;
    color:rgba(220,238,246,.55); pointer-events:none; }
  footer a{ color:var(--dim); pointer-events:auto; }
  #loader{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; gap:18px;
    align-items:center; justify-content:center; background:#05090b; transition:opacity .7s; }
  #loader.done{ opacity:0; pointer-events:none; }
  #loader .ring{ width:54px; height:54px; border-radius:50%;
    border:2px solid rgba(143,208,240,.2); border-top-color:var(--gold);
    animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loader .pct{ font-size:12px; letter-spacing:.3em; color:var(--dim); }
  @media (max-width:640px){ header{ left:20px; top:18px; } #back{ right:20px; top:18px; } footer{ display:none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<header>
  <div class="kicker">Interactive 3D</div>
  <h1>INFINIAN</h1>
  <div class="sub">Lineage Series</div>
</header>

<a id="back" href="./">← Back to site</a>
<div id="actions"></div>
<div id="hint">Drag to orbit · Scroll to zoom</div>
<footer>Model: “Infinian (Lineage Series)” by <a href="https://sketchfab.com/3d-models/infinian-lineage-series-1279221a3196400d92a078319a5b3f40" target="_blank" rel="noopener">Doctor A.</a> · CC Attribution · via Sketchfab</footer>

<div id="loader"><div class="ring"></div><div class="pct" id="pct">LOADING MODEL</div></div>

<script type="importmap">
{ "imports": {
  "three": "./assets/js/vendor/three.module.js",
  "three/addons/": "./assets/js/vendor/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05090b);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.addEventListener('start', () => controls.autoRotate = false);

scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x1a1206, 0.9));
const key = new THREE.DirectionalLight(0xfff1da, 2.4); key.position.set(4, 7, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x72b2d5, 1.8); rim.position.set(-6, 3, -5); scene.add(rim);
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color: 0x0d3050, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2; scene.add(ground);

const pct = document.getElementById('pct');
const loaderEl = document.getElementById('loader');
let mixer = null, current = null;
const actionsBar = document.getElementById('actions');

function play(clip, btn) {
  if (!mixer || current === clip) return;
  const next = mixer.clipAction(clip);
  next.reset().setLoop(THREE.LoopRepeat).fadeIn(0.35).play();
  if (current) current.fadeOut(0.35);
  current = next;
  actionsBar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
}

const gltf = await new GLTFLoader().loadAsync('assets/models/infinian.glb', e => {
  if (e.total) pct.textContent = 'LOADING MODEL · ' + Math.round(e.loaded / e.total * 100) + '%';
});
scene.add(gltf.scene);

// NOTE: this model's real size only appears once an animation pose is applied
// (bind pose is ~39x smaller), so pose first, then measure and frame.
mixer = new THREE.AnimationMixer(gltf.scene);
const idleClip = gltf.animations.find(a => /CombatIdle/i.test(a.name)) || gltf.animations[0];
current = mixer.clipAction(idleClip); current.play();
mixer.setTime(idleClip.duration * 0.3);
gltf.scene.updateMatrixWorld(true);

const box = new THREE.Box3().setFromObject(gltf.scene);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
ground.position.y = box.min.y - 0.01;
controls.target.copy(center);
const radius = size.length() / 2;
camera.position.set(center.x + radius * 0.95, center.y + radius * 0.30, center.z + radius * 1.62);
camera.lookAt(controls.target);
window.__stageInfo = { min: box.min.toArray(), max: box.max.toArray(), center: center.toArray(), cam: camera.position.toArray() };

const label = n => n.replace('Mon_Infinian_001_', '').replace(/([a-z])(\d)/g, '$1 $2');
for (const clip of gltf.animations) {
  const b = document.createElement('button');
  b.textContent = label(clip.name);
  b.addEventListener('click', () => play(clip, b));
  if (clip === idleClip) b.classList.add('active');
  actionsBar.appendChild(b);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
loaderEl.classList.add('done');
window.__stageReady = true;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
